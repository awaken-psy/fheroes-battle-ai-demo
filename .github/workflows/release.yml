name: Build & Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-amd64
            ext: ''
          - os: windows-latest
            platform: windows-amd64
            ext: .exe
          - os: macos-14
            platform: macos-arm64
            ext: ''

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          pip install pygame pyinstaller

      - name: Build
        run: >
          pyinstaller --onefile --name fheroes-battle-ai-demo
          --hidden-import=config --hidden-import=config.colors
          --hidden-import=config.units --hidden-import=config.presets
          --hidden-import=config.timing
          --hidden-import=engine --hidden-import=engine.hex_grid
          --hidden-import=engine.unit --hidden-import=engine.battle_state
          --hidden-import=engine.battle_logger --hidden-import=engine.actions
          --hidden-import=engine.hero --hidden-import=engine.spells
          --hidden-import=engine.castle
          --hidden-import=ai --hidden-import=ai.base --hidden-import=ai.factory
          --hidden-import=ai.classic --hidden-import=ai.classic.planner
          --hidden-import=ai.classic.evaluation --hidden-import=ai.classic.scoring
          --hidden-import=ai.classic.strategy --hidden-import=ai.classic.spells
          --hidden-import=ai.classic.retreat
          --hidden-import=ui --hidden-import=ui.fonts
          --hidden-import=ui.renderer --hidden-import=ui.hex_renderer
          --hidden-import=ui.game
          --hidden-import=ui.screens --hidden-import=ui.screens.setup
          --hidden-import=ui.screens.battle
          main.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: fheroes-battle-ai-demo-${{ matrix.platform }}
          path: dist/fheroes-battle-ai-demo${{ matrix.ext }}

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Rename with platform suffix
        run: |
          mkdir -p upload
          cp artifacts/fheroes-battle-ai-demo-linux-amd64/fheroes-battle-ai-demo upload/fheroes-battle-ai-demo-linux-amd64
          cp artifacts/fheroes-battle-ai-demo-windows-amd64/fheroes-battle-ai-demo.exe upload/fheroes-battle-ai-demo-windows-amd64.exe
          cp artifacts/fheroes-battle-ai-demo-macos-arm64/fheroes-battle-ai-demo upload/fheroes-battle-ai-demo-macos-arm64
          chmod +x upload/fheroes-battle-ai-demo-linux-amd64 upload/fheroes-battle-ai-demo-macos-arm64

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: upload/*
          generate_release_notes: true
