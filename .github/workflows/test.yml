name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv python install 3.13

      - name: Sync dependencies
        run: uv sync --group dev

      - name: Run pytest
        run: uv run pytest

      - name: Arena smoke (mirror fairness)
        run: uv run python scripts/arena.py --preset Balanced --games 100 --mirror --seed 0
