[project]
name = "fheroes-battle-ai-demo"
version = "0.2.0"
description = "HoMM2 Battle AI Demo — tactical AI reimplementation from fheroes2"
requires-python = ">=3.11"
dependencies = [
    "gymnasium>=0.29",
    "numpy>=2.4.6",
    "pygame>=2.6",
    "tensorboard>=2.14",
    "torch>=2.6.0",
]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu124" }

[project.scripts]
fheroes-battle-ai-demo = "main:main"

[dependency-groups]
dev = [
    "matplotlib>=3.8",
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
