[project]
name = "fheroes-battle-ai-demo"
version = "0.2.0"
description = "HoMM2 Battle AI Demo — tactical AI reimplementation from fheroes2"
requires-python = ">=3.11"
dependencies = [
    "gymnasium>=0.29",
    "numpy>=2.4.6",
    "pygame>=2.6",
]

[project.scripts]
fheroes-battle-ai-demo = "main:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
